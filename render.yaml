# Optional: connect this repo at https://dashboard.render.com (Blueprint)
services:
  - type: web
    name: advisor-pulse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PYTHONPATH
        value: /app/backend
